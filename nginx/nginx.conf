upstream cdn_backend {
    server cdn-node-1:3001;
    server cdn-node-2:3002;
    server cdn-node-3:3003;
}

server {
    listen 80;

    location / {
        proxy_pass http://cdn_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
